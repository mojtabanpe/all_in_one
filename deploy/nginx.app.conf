# Inside the "web" container (host network): one origin for every app.
#   /          public SSR site        → 127.0.0.1:4322
#   /app/      customer app (PWA)     → static
#   /admin/    admin app              → static
#   /api/      NestJS api             → 127.0.0.1:4321
#   OAuth for the ChatGPT connection  → api (paths fixed by the MCP SDK)
server {
    listen 127.0.0.1:4320;
    server_name _;
    client_max_body_size 2m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/ {
        proxy_pass http://127.0.0.1:4321;
        # AI reading texts and speech can take a while.
        proxy_read_timeout 150s;
    }
    location ~ ^/(authorize|token|register|revoke)$ {
        proxy_pass http://127.0.0.1:4321;
    }
    location ^~ /.well-known/oauth- {
        proxy_pass http://127.0.0.1:4321;
    }

    location = /app { return 301 /app/; }
    location /app/ {
        alias /srv/customer/;
        try_files $uri $uri/ /app/index.html;
        location ~ ^/app/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
            alias /srv/customer/$1;
            add_header Cache-Control "no-cache";
        }
        location = /app/manifest.webmanifest {
            alias /srv/customer/manifest.webmanifest;
            types { }
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }
        location ~ ^/app/(.+\.(?:js|css|woff2?))$ {
            alias /srv/customer/$1;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header X-Robots-Tag "noindex";
        location ~ ^/admin/(.+\.(?:js|css|woff2?))$ {
            alias /srv/admin/$1;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location / {
        proxy_pass http://127.0.0.1:4322;
    }
}
