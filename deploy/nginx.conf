# Host nginx for poshtetgarm.ir (install once, after the certificate exists).
# Replaces the Recall server block: everything goes to the all-in-one "web" container.
server {
    listen 80;
    server_name poshtetgarm.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    # nginx < 1.25 on the server: http2 goes on the listen line.
    listen 443 ssl http2;
    server_name poshtetgarm.ir;
    ssl_certificate /etc/letsencrypt/live/poshtetgarm.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poshtetgarm.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4320;
        proxy_redirect http://$host:4320/ /;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
    }
}
