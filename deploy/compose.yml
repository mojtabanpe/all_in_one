# poshtetgarm.ir: api, SSR site and nginx (host network, loopback only), Postgres and Redis.
# The host's nginx terminates TLS and forwards everything to 127.0.0.1:4320 (deploy/nginx.conf).
#   Started by deploy/release.sh <git sha> (blue/green); do not run `up -d` for every service by hand.
name: all-in-one
services:
  # Blue/green: deploy/release.sh starts the new release in the idle colour (a or b) next to the live one,
  # waits until it is healthy, then stops the old colour. The web nginx sends each request to whichever colour
  # answers, so a release never leaves the api or the site without a running server. Ports: a = 4321/4322,
  # b = 4331/4332. Migrations run when the new api starts, while the old one still serves: keep them additive
  # (expand first, remove old columns in a later release).
  api-a: &api
    image: all-in-one-api:${RELEASE_A:-none}
    network_mode: host
    restart: unless-stopped
    env_file: ${AIO_ENV_FILE:-/opt/all-in-one/shared/.env}
    environment: &api-env
      NODE_ENV: production
      API_HOST: 127.0.0.1
      API_PORT: 4321
      APP_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      APP_PUBLIC_URL: https://${APP_DOMAIN}/app
      # ChatGPT/Claude reach the MCP server through the Cloudflare front (deploy/mcp-front): OpenAI's and
      # Anthropic's servers cannot reach this host directly since November 2026.
      MCP_PUBLIC_URL: https://poshtetgarm-mcp.memnpe.workers.dev
      DATABASE_URL: postgresql://aio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@127.0.0.1:15433/all_in_one
      REDIS_URL: redis://127.0.0.1:16380
      # Stamped on error events (GlitchTip, directive 184); GLITCHTIP_DSN itself is in the shared .env.
      APP_RELEASE: ${RELEASE_A:-none}
      # Supplied by the production GitHub Environment secret at release time.
      # Never stored in images, the checkout, or copied from a developer machine.
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    volumes:
      - exercise-videos:/app/data/exercise-videos
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    # SIGTERM lets requests in flight (AI calls take up to a minute or two) finish before the old colour stops.
    stop_grace_period: 90s

  api-b:
    <<: *api
    image: all-in-one-api:${RELEASE_B:-none}
    environment:
      <<: *api-env
      API_PORT: 4331
      APP_RELEASE: ${RELEASE_B:-none}

  public-a: &public
    image: all-in-one-public:${RELEASE_A:-none}
    network_mode: host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 4322
      NG_ALLOWED_HOSTS: ${APP_DOMAIN}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

  public-b:
    <<: *public
    image: all-in-one-public:${RELEASE_B:-none}
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 4332
      NG_ALLOWED_HOSTS: ${APP_DOMAIN}

  web:
    image: all-in-one-web:${RELEASE:-none}
    network_mode: host
    restart: unless-stopped
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: all_in_one
    ports: ['127.0.0.1:15433:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    shm_size: 128mb
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aio -d all_in_one]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]

  # Error monitoring (directive 184). One process (web + background tasks) on Postgres, no Redis. It listens on
  # loopback only: the api sends events to 127.0.0.1:4340, and the dashboard is reached through an SSH tunnel
  # (`ssh -L 4340:127.0.0.1:4340 flashcard`, then http://localhost:4340). Not started unless GLITCHTIP_SECRET_KEY is
  # set in compose.env (deploy/release.sh). Capped so it can never starve the api.
  glitchtip:
    image: glitchtip/glitchtip:6.1.1
    network_mode: host
    restart: unless-stopped
    mem_limit: 400m
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-unset}
      DATABASE_URL: postgresql://aio:${POSTGRES_PASSWORD}@127.0.0.1:15433/glitchtip
      VALKEY_URL: ''
      GLITCHTIP_DOMAIN: http://localhost:4340
      ALLOWED_HOSTS: localhost,127.0.0.1
      GRANIAN_HOST: 127.0.0.1
      GRANIAN_PORT: 4340
      # Sign-up stays off; set GLITCHTIP_REGISTRATION=true in compose.env only to create the first account.
      ENABLE_USER_REGISTRATION: ${GLITCHTIP_REGISTRATION:-false}
      ENABLE_ORGANIZATION_CREATION: ${GLITCHTIP_REGISTRATION:-false}
      GLITCHTIP_RETENTION_DAYS: 90
      EMAIL_URL: consolemail://
      DEFAULT_FROM_EMAIL: monitor@poshtetgarm.ir
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --maxmemory,
        256mb,
        --maxmemory-policy,
        allkeys-lru,
      ]
    ports: ['127.0.0.1:16380:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  redis-data:
  exercise-videos:
