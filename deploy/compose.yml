# poshtetgarm.ir: api, SSR site and nginx (host network, loopback only), Postgres and Redis.
# The host's nginx terminates TLS and forwards everything to 127.0.0.1:4320 (deploy/nginx.conf).
#   Started by deploy/release.sh <git sha> (blue/green); do not run `up -d` for every service by hand.
name: all-in-one
services:
  # Blue/green: deploy/release.sh starts the new release in the idle colour (a or b) next to the live one,
  # waits until it is healthy, then stops the old colour. The web nginx sends each request to whichever colour
  # answers, so a release never leaves the api or the site without a running server. Ports: a = 4321/4322,
  # b = 4331/4332. Migrations run when the new api starts, while the old one still serves: keep them additive
  # (expand first, remove old columns in a later release).
  api-a: &api
    image: all-in-one-api:${RELEASE_A:-none}
    network_mode: host
    restart: unless-stopped
    env_file: ${AIO_ENV_FILE:-/opt/all-in-one/shared/.env}
    environment: &api-env
      NODE_ENV: production
      API_HOST: 127.0.0.1
      API_PORT: 4321
      APP_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      APP_PUBLIC_URL: https://${APP_DOMAIN}/app
      MCP_PUBLIC_URL: https://${APP_DOMAIN}
      DATABASE_URL: postgresql://aio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@127.0.0.1:15433/all_in_one
      REDIS_URL: redis://127.0.0.1:16380
      # Supplied by the production GitHub Environment secret at release time.
      # Never stored in images, the checkout, or copied from a developer machine.
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    volumes:
      - exercise-videos:/app/data/exercise-videos
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    # SIGTERM lets requests in flight (AI calls take up to a minute or two) finish before the old colour stops.
    stop_grace_period: 90s

  api-b:
    <<: *api
    image: all-in-one-api:${RELEASE_B:-none}
    environment:
      <<: *api-env
      API_PORT: 4331

  public-a: &public
    image: all-in-one-public:${RELEASE_A:-none}
    network_mode: host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 4322
      NG_ALLOWED_HOSTS: ${APP_DOMAIN}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

  public-b:
    <<: *public
    image: all-in-one-public:${RELEASE_B:-none}
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 4332
      NG_ALLOWED_HOSTS: ${APP_DOMAIN}

  web:
    image: all-in-one-web:${RELEASE:-none}
    network_mode: host
    restart: unless-stopped
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: all_in_one
    ports: ['127.0.0.1:15433:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    shm_size: 128mb
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aio -d all_in_one]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --maxmemory,
        256mb,
        --maxmemory-policy,
        allkeys-lru,
      ]
    ports: ['127.0.0.1:16380:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  redis-data:
  exercise-videos:
