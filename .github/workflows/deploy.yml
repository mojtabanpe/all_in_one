name: Deploy

# After CI passes on master: build the images on GitHub (amd64, Docker Hub reachable) and push them to GHCR,
# then the server's self-hosted runner (label "aio") pulls them and starts the release.
# A pull only transfers the layers the server does not have yet (the dependencies layer changes only with the
# lockfile), and Docker checks every layer's digest. If GHCR cannot be reached from the server, the images are
# bundled as per-image artifacts instead and downloaded with resume, retries and a checksum check.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.check.outputs.required }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('required', 'true');
              return;
            }
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: run.id,
              per_page: 100,
            });
            const required = artifacts.some(artifact =>
              artifact.name === `production-deploy-${run.head_sha}` && !artifact.expired);
            core.setOutput('required', String(required));
            core.summary.addRaw(required
              ? 'Code/configuration changes: deployment required.'
              : 'No deployment marker: documentation-only push, or marker unavailable. Build and deployment skipped; manual Deploy remains available.');
            await core.summary.write();

  build:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: release
        run: echo "release=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp application version
        env:
          RELEASE_PATCH: ${{ github.run_number }}
        run: node tools/scripts/write-app-version.mjs

      - uses: docker/setup-buildx-action@v3

      # Exposes the Actions cache token to `docker buildx` in run steps; without it type=gha is silently skipped.
      - uses: crazy-max/ghaction-github-runtime@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        # One cache scope per image: a shared scope is overwritten by the next target, the api's
        # COPY --from=deps then reruns and the 320 MB node_modules layer gets a new digest every release.
        run: |
          for t in api public web; do
            docker buildx build -f deploy/images.dockerfile --target "$t" \
              --cache-from "type=gha,scope=aio-$t" --cache-to "type=gha,scope=aio-$t,mode=max" \
              --provenance=false --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --push -t "$REGISTRY/all-in-one-$t:$RELEASE" .
          done

      - name: Report image sizes
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          for t in api public web; do
            docker buildx imagetools inspect --raw "$REGISTRY/all-in-one-$t:$RELEASE" \
              | jq -r --arg t "$t" '"\($t): \(([.layers[].size] | add) / 1048576 | floor) MiB compressed; layers (MiB): \([.layers[].size / 1048576 | . * 10 | floor / 10] | join(", "))"'
          done

      - name: Prune old registry versions
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: all-in-one-api
          package-type: container
          min-versions-to-keep: 15
      - continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: all-in-one-public
          package-type: container
          min-versions-to-keep: 15
      - continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: all-in-one-web
          package-type: container
          min-versions-to-keep: 15

  # Pull from GHCR on the server. Never fails the run by itself: "pulled" tells the next jobs which path to take.
  pull:
    needs: build
    runs-on: [self-hosted, aio]
    permissions:
      contents: read
      packages: read
    outputs:
      pulled: ${{ steps.pull.outputs.pulled }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: pull
        env:
          RELEASE: ${{ needs.build.outputs.release }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          pulled=false
          if sh deploy/pull-images.sh api public web; then
            pulled=true
          else
            echo "::warning::GHCR pull failed; falling back to artifacts"
          fi
          echo "pulled=$pulled" >> "$GITHUB_OUTPUT"

  # Fallback only: per-image artifacts built from the pushed images.
  bundle:
    needs: [build, pull]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.pull.outputs.pulled != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      api: ${{ steps.api.outputs.artifact-id }}:${{ steps.api.outputs.artifact-digest }}
      public: ${{ steps.public.outputs.artifact-id }}:${{ steps.public.outputs.artifact-digest }}
      web: ${{ steps.web.outputs.artifact-id }}:${{ steps.web.outputs.artifact-digest }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Save images
        env:
          RELEASE: ${{ needs.build.outputs.release }}
        run: |
          for t in api public web; do
            docker pull -q "$REGISTRY/all-in-one-$t:$RELEASE"
            docker tag "$REGISTRY/all-in-one-$t:$RELEASE" "all-in-one-$t:$RELEASE"
            docker save "all-in-one-$t:$RELEASE" | gzip -1 > "$t.tar.gz"
          done
          ls -l *.tar.gz

      - id: api
        uses: actions/upload-artifact@v4
        with:
          name: image-api
          path: api.tar.gz
          retention-days: 1
          compression-level: 0
      - id: public
        uses: actions/upload-artifact@v4
        with:
          name: image-public
          path: public.tar.gz
          retention-days: 1
          compression-level: 0
      - id: web
        uses: actions/upload-artifact@v4
        with:
          name: image-web
          path: web.tar.gz
          retention-days: 1
          compression-level: 0

  deploy:
    needs: [build, pull, bundle]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.pull.outputs.pulled == 'true' || needs.bundle.result == 'success') }}
    runs-on: [self-hosted, aio]
    environment:
      name: production
      url: https://poshtetgarm.ir
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download images (fallback)
        if: needs.pull.outputs.pulled != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS: api=${{ needs.bundle.outputs.api }} public=${{ needs.bundle.outputs.public }} web=${{ needs.bundle.outputs.web }}
        run: sh deploy/fetch-images.sh $ARTIFACTS

      - name: Start release
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          VPN_SERVICE_TOKEN: ${{ secrets.VPN_SERVICE_TOKEN }}
          RELEASE: ${{ needs.build.outputs.release }}
        run: |
          # A wrong Firebase secret stops the release (exit 1). Google's token endpoint being unreachable from
          # the server (filtered networks, seen 2026-11-16/17) only affects native push, so after three tries
          # it is a warning (exit 2) and the web release goes ahead.
          if [ -n "${FCM_SERVICE_ACCOUNT_JSON:-}" ]; then
            status=0
            docker run --rm --network host -e FCM_SERVICE_ACCOUNT_JSON \
              --entrypoint node "all-in-one-api:$RELEASE" -e '
                (async () => {
                  const { cert } = require("firebase-admin/app");
                  let credential;
                  try {
                    const account = JSON.parse(process.env.FCM_SERVICE_ACCOUNT_JSON);
                    if (account.project_id !== "poshtetgarm") throw new Error();
                    credential = cert(account);
                  } catch {
                    console.error("Firebase secret is not a valid poshtetgarm service account");
                    process.exit(1);
                  }
                  for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                      await Promise.race([
                        credential.getAccessToken(),
                        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 20000)),
                      ]);
                      console.log("Firebase server authentication verified");
                      process.exit(0);
                    } catch (error) {
                      const text = String((error && error.message) || error);
                      // Google answered and refused the key: the secret is wrong, not the network.
                      if (/invalid_grant|invalid_client|unauthorized_client|account not found/i.test(text)) {
                        console.error("Firebase rejected the service account; check the production secret");
                        process.exit(1);
                      }
                      console.error("Firebase token endpoint unreachable (attempt " + attempt + " of 3)");
                    }
                  }
                  process.exit(2);
                })();
              ' || status=$?
            if [ "$status" = 2 ]; then
              echo "::warning title=Native push::Google token endpoint unreachable from the server; releasing anyway. Native (FCM) push cannot send until the server reaches oauth2.googleapis.com."
            elif [ "$status" != 0 ]; then
              exit "$status"
            fi
          fi
          sh deploy/release.sh "$RELEASE"
