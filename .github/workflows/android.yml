name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive architecture-specific APKs (optional)
        required: false
        type: string
  push:
    branches: [master]
    paths: ['native/poshtetgarm/**', '.github/workflows/android.yml']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # direct: GitHub Releases, pays on the web gateway, one APK per ABI (directive 57).
    # bazaar / myket: one universal APK each for the store panels, paying with the store's in-app billing.
    strategy:
      fail-fast: false
      matrix:
        flavor: [direct, bazaar, myket]
    defaults:
      run:
        working-directory: native/poshtetgarm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Configure Firebase app
        run: python3 scripts/configure-android.py
      - run: flutter pub get
      - run: flutter analyze
        if: matrix.flavor == 'direct'
      - run: flutter test --dart-define-from-file=firebase.android.json
        if: matrix.flavor == 'direct'
      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          FLAVOR: ${{ matrix.flavor }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Public in-app billing keys from the store panels (repository variables, not secrets).
          BAZAAR_RSA_PUBLIC_KEY: ${{ vars.BAZAAR_RSA_PUBLIC_KEY }}
          MYKET_RSA_PUBLIC_KEY: ${{ vars.MYKET_RSA_PUBLIC_KEY }}
        run: sh scripts/build-android.sh ${{ matrix.flavor == 'direct' && '--split-per-abi' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: Poshtetgarm-Android-${{ matrix.flavor }}-${{ github.sha }}
          path: native/poshtetgarm/build/app/outputs/flutter-apk/app-*${{ matrix.flavor }}-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish architecture-specific installers
        if: matrix.flavor == 'direct' && github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          gh release view "$RELEASE_TAG" > /dev/null
          version=$(awk '/^version:/ {split($2, value, "+"); print value[1]}' pubspec.yaml)
          mkdir -p dist/split
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-direct-release.apk" "dist/split/Poshtetgarm-$version-$abi.apk"
          done
          (cd dist/split && sha256sum ./*.apk > SHA256SUMS-Android.txt)
          gh release upload "$RELEASE_TAG" dist/split/*.apk dist/split/SHA256SUMS-Android.txt --clobber
