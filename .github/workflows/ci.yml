name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    services:
      planner-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: recurrence-ci-only
          POSTGRES_DB: aio_recurrence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aio_recurrence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANNER_TEST_DATABASE_URL: postgresql://postgres:recurrence-ci-only@127.0.0.1:5432/aio_recurrence
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - run: pnpm nx format:check
      - name: Migrate isolated planner integration database
        run: pnpm nx run api-db:prisma-deploy
        env:
          DATABASE_URL: ${{ env.PLANNER_TEST_DATABASE_URL }}
      - run: pnpm nx affected -t lint test build typecheck
